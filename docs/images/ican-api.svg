<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">你的 API，你来定参数</title><desc id="desc">仅展示参数示例，实际可用值以接入的服务和模型为准。</desc><rect x="0" y="0" width="1200" height="570" rx="18" fill="#181715" stroke="#44403c"/><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="0" cy="10" r="0.7" fill="#44403c"/></pattern></defs><rect x="0" y="130" width="1200" height="405" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="36" y="45" font-size="23" fill="#f5f5f4">ICAN</text><text x="140" y="45" font-size="19" fill="#f5f5f4">你的 API，你来定参数</text><text x="36" y="86" font-size="16" fill="#d6d3d1">仅展示参数示例，实际可用值以接入的服务和模型为准。</text><text x="36" y="546" font-size="13" fill="#a8a29e">功能示意 · 非界面截图</text><rect x="50" y="135" width="515" height="355" rx="12" fill="#1f1d1a" stroke="#44403c"/><rect x="610" y="135" width="540" height="355" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="76" y="174" font-size="23" fill="#f5f5f4">API 连接</text><text x="636" y="174" font-size="23" fill="#f5f5f4">视频参数</text><text x="76" y="212" font-size="15" fill="#a8a29e">接口地址</text><rect x="76" y="224" width="463" height="46" rx="12" fill="#292524" stroke="#44403c"/><text x="92" y="254" font-size="18" fill="#f5f5f4">https://api.example.com</text><text x="76" y="298" font-size="15" fill="#a8a29e">API Key</text><rect x="76" y="310" width="463" height="46" rx="12" fill="#292524" stroke="#44403c"/><text x="92" y="340" font-size="18" fill="#f5f5f4">••••••••••••••••</text><text x="76" y="384" font-size="15" fill="#a8a29e">模型</text><rect x="76" y="396" width="463" height="46" rx="12" fill="#292524" stroke="#44403c"/><text x="92" y="426" font-size="18" fill="#f5f5f4">自行填写模型 ID</text><text x="636" y="212" font-size="15" fill="#a8a29e">画面比例</text><rect x="636" y="224" width="218" height="46" rx="12" fill="#292524" stroke="#44403c"/><text x="652" y="254" font-size="18" fill="#f5f5f4">9:16