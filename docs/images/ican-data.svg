<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">更新应用，保留数据</title><desc id="desc">沿用持久目录和加密密钥；涉及数据格式变更时，先验证迁移。</desc><rect x="0" y="0" width="1200" height="570" rx="18" fill="#181715" stroke="#44403c"/><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="0" cy="10" r="0.7" fill="#44403c"/></pattern></defs><rect x="0" y="130" width="1200" height="405" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="36" y="45" font-size="23" fill="#f5f5f4">ICAN</text><text x="140" y="45" font-size="19" fill="#f5f5f4">更新应用，保留数据</text><text x="36" y="86" font-size="16" fill="#d6d3d1">沿用持久目录和加密密钥；涉及数据格式变更时，先验证迁移。</text><text x="36" y="546" font-size="13" fill="#a8a29e">功能示意 · 非界面截图</text><rect x="50" y="159" width="320" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="76" y="201" font-size="24" fill="#f5f5f4">应用容器</text><text x="76" y="244" font-size="20" fill="#f5f5f4">前端 + 后端</text><text x="76" y="280" font-size="17" fill="#d6d3d1">替换为已验证的镜像</text><text x="76" y="325" font-size="17" fill="#a8a29e">程序代码与依赖</text><text x="76" y="421" font-size="18" fill="#f5f5f4">不重新初始化数据库</text><path d="M370 278 C417.5 278 417.5 278 465 278" fill="none" stroke="#a8a29e" stroke-width="2"/><circle cx="370" cy="278" r="4" fill="#d6d3d1"/><circle cx="465" cy="278" r="4" fill="#d6d3d1"/><rect x="465" y="159" width="340" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="491" y="201" font-size="23" fill="#f5f5f4">ICAN_DATA_DIR</text><text x="491" y="247" font-size="22" fill="#f5f5f4">ican.db</text><text x="491" y="276" font-size="16" fill="#d6d3d1">账号 · API 配置 · 任务</text><text x="491" y="325" font-size="22" fill="#f5f5f4">media/</text><text x="491" y="354" font-size="16" fill="#d6d3d1">图片 · 视频 · 音频</text><text x="491" y="421" font-size="18" fill="#f5f5f4">保存在容器之外</text><rect x="850" y="159" width="300" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="874" y="201" font-size="22" fill="#f5f5f4">密钥与备份</text><text x="874" y="247" font-size="16" fill="#f5f5f4">DATA_ENCRYPTION_KEY</text><text x="874" y="281" font-size="18" fill="#f5f5f4">保留原加密密钥</text><text x="874" y="328" font-size="17" fill="#d6d3d1">备份数据库和媒体</text><text x="874" y="363" font-size="17" fill="#d6d3d1">密钥单独妥善保管</text><text x="874" y="421" font-size="18" fill="#f5f5f4">验证恢复流程</text></g></svg>
