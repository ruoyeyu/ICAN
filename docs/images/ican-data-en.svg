<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Update the app. Keep your data.</title><desc id="desc">Reuse the persistent directory and encryption key. Test migrations before upgrading.</desc><rect x="0" y="0" width="1200" height="570" rx="18" fill="#181715" stroke="#44403c"/><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="0" cy="10" r="0.7" fill="#44403c"/></pattern></defs><rect x="0" y="130" width="1200" height="405" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="36" y="45" font-size="23" fill="#f5f5f4">ICAN</text><text x="140" y="45" font-size="19" fill="#f5f5f4">Update the app. Keep your data.</text><text x="36" y="86" font-size="16" fill="#d6d3d1">Reuse the persistent directory and encryption key. Test migrations before upgrading.</text><text x="36" y="546" font-size="13" fill="#a8a29e">WORKFLOW ILLUSTRATION · NOT A SCREENSHOT</text><rect x="50" y="159" width="320" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="76" y="201" font-size="24" fill="#f5f5f4">Application container</text><text x="76" y="244" font-size="20" fill="#f5f5f4">Frontend + backend</text><text x="76" y="280" font-size="17" fill="#d6d3d1">Replace with a verified image</text><text x="76" y="325" font-size="17" fill="#a8a29e">Code and dependencies</text><text x="76" y="421" font-size="18" fill="#f5f5f4">No database reset</text><path d="M370 278 C417.5 278 417.5 278 465 278" fill="none" stroke="#a8a29e" stroke-width="2"/><circle cx="370" cy="278" r="4" fill="#d6d3d1"/><circle cx="465" cy="278" r="4" fill="#d6d3d1"/><rect x="465" y="159" width="340" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="491" y="201" font-size="23" fill="#f5f5f4">ICAN_DATA_DIR</text><text x="491" y="247" font-size="22" fill="#f5f5f4">ican.db</text><text x="491" y="276" font-size="16" fill="#d6d3d1">Accounts · API settings · Tasks</text><text x="491" y="325" font-size="22" fill="#f5f5f4">media/</text><text x="491" y="354" font-size="16" fill="#d6d3d1">Images · Video · Audio</text><text x="491" y="421" font-size="18" fill="#f5f5f4">Outside the container</text><rect x="850" y="159" width="300" height="302" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="874" y="201" font-size="22" fill="#f5f5f4">Secrets &amp; backups</text><text x="874" y="247" font-size="16" fill="#f5f5f4">DATA_ENCRYPTION_KEY</text><text x="874" y="281" font-size="18" fill="#f5f5f4">Keep the same key</text><text x="874" y="328" font-size="17" fill="#d6d3d1">Back up data and media</text><text x="874" y="363" font-size="17" fill="#d6d3d1">Protect keys separately</text><text x="874" y="421" font-size="18" fill="#f5f5f4">Verify recovery</text></g></svg>
