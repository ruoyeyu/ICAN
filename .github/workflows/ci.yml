name: ICAN verification
on:
  push:
    branches: [main, security/runtime-isolation-candidate]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSES/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and test final image without publishing
        run: docker build --progress=plain -t ican:verify .
      - name: Test deployment policy rejection cases
        run: python3 -B -m unittest discover -s scripts -p test_container_policy.py -v
      - name: Verify final image isolation and restart recovery
        run: sh scripts/verify-image.sh
      - name: Verify native allocation, resolver and isolated TLS
        run: sh scripts/verify-runtime.sh
      - name: Verify actual Compose deployment with disposable fixtures
        run: sh scripts/verify-compose.sh
      - name: Inventory native binaries without executing them
        run: python3 scripts/inventory-image.py
      - name: Scan installed image components
        run: python3 scripts/scan-image.py
      - name: Preserve image scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-security-evidence
          path: |
            image-vulnerabilities.json
            image-native-inventory.json
            image-sbom.cdx.json
            runtime-regressions.log
            compose-policy.json
          if-no-files-found: warn
