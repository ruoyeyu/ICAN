# Deployment values must be reviewed and explicitly chosen before use.
services:
  app:
    image: ${ICAN_IMAGE:?set the verified immutable image reference}
    pull_policy: never
    platform: linux/amd64
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact HTTPS origin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set administrator username}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set a unique bootstrap password}
      JWT_SECRET: ${JWT_SECRET:?set an independent random secret}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set an independent encryption key}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      STORAGE_DRIVER: sqlite
      DATABASE_DSN: /app/data/ican.db
      MEDIA_DIR: /app/data/media
      AI_LOG_DIR: /app/data/logs
      AUTH_ATTEMPTS_PER_MINUTE: ${AUTH_ATTEMPTS_PER_MINUTE:?confirm authentication request limit}
      MEDIA_LINK_TTL_SECONDS: ${MEDIA_LINK_TTL_SECONDS:?confirm supplier link lifetime}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${ICAN_PIDS_LIMIT:?confirm process limit}
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.6
    volumes:
      - type: bind
        source: ${ICAN_DATA_DIR:?set backed-up isolated data directory}
        target: /app/data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=${ICAN_TMP_BYTES:?confirm temporary storage limit},uid=10001,gid=10001
      - /app/web/.next/cache:rw,nosuid,nodev,noexec,size=${ICAN_CACHE_BYTES:?confirm cache limit},uid=10001,gid=10001
    ports:
      - "127.0.0.1:${ICAN_HOST_PORT:?choose unused staging port}:3000"
    restart: unless-stopped
    networks: [ican]
networks:
  ican:
    driver: bridge
