<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">从参考到结果，都在一张画布上</title><desc id="desc">连接输入，选择模型，把结果留在同一个项目里。</desc><rect x="0" y="0" width="1200" height="570" rx="18" fill="#181715" stroke="#44403c"/><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="0" cy="10" r="0.7" fill="#44403c"/></pattern></defs><rect x="0" y="130" width="1200" height="405" fill="url(#dots)"/><g font-family="Arial, sans-serif"><text x="36" y="45" font-size="23" fill="#f5f5f4">ICAN</text><text x="140" y="45" font-size="19" fill="#f5f5f4">从参考到结果，都在一张画布上</text><text x="36" y="86" font-size="16" fill="#d6d3d1">连接输入，选择模型，把结果留在同一个项目里。</text><text x="36" y="546" font-size="13" fill="#a8a29e">功能示意 · 非界面截图</text><path d="M300 240 C370.0 240 370.0 315 440 315" fill="none" stroke="#a8a29e" stroke-width="2"/><circle cx="300" cy="240" r="4" fill="#d6d3d1"/><circle cx="440" cy="315" r="4" fill="#d6d3d1"/><path d="M300 410 C370.0 410 370.0 335 440 335" fill="none" stroke="#a8a29e" stroke-width="2"/><circle cx="300" cy="410" r="4" fill="#d6d3d1"/><circle cx="440" cy="335" r="4" fill="#d6d3d1"/><path d="M740 325 C810.0 325 810.0 290 880 290" fill="none" stroke="#a8a29e" stroke-width="2"/><circle cx="740" cy="325" r="4" fill="#d6d3d1"/><circle cx="880" cy="290" r="4" fill="#d6d3d1"/><rect x="50" y="150" width="250" height="170" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="70" y="181" font-size="18" fill="#f5f5f4">参考图片</text><rect x="70" y="200" width="210" height="99" rx="6" fill="#a8a29e" stroke="#a8a29e"/><path d="M70 280 120 235 178 274 220 243 280 284 V299 H70Z" fill="#57534e"/><circle cx="245" cy="221" r="9" fill="#e7e5df"/><rect x="50" y="350" width="250" height="125" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="70" y="383" font-size="18" fill="#f5f5f4">提示词</text><text x="70" y="419" font-size="16" fill="#d6d3d1">柔和光线，安静的远山</text><text x="70" y="448" font-size="16" fill="#a8a29e">镜头缓慢移动</text><rect x="440" y="220" width="300" height="215" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="464" y="257" font-size="22" fill="#f5f5f4">视频生成</text><text x="464" y="295" font-size="16" fill="#d6d3d1">模型：自行配置的模型</text><text x="464" y="331" font-size="19" fill="#f5f5f4">9:16     /     720p     /     5s</text><rect x="464" y="363" width="252" height="45" rx="7" fill="#f5f5f4" stroke="#f5f5f4"/><text x="483" y="392" font-size="17" fill="#292524">使用自己的 API 生成</text><rect x="880" y="168" width="270" height="270" rx="12" fill="#1f1d1a" stroke="#44403c"/><text x="904" y="205" font-size="22" fill="#f5f5f4">生成结果</text><rect x="904" y="227" width="222" height="126" rx="12" fill="#292524" stroke="#44403c"/><path d="m1003 267 0 43 35-22Z" fill="#d6d3d1"/><text x="904" y="385" font-size="16" fill="#f5f5f4">预览 · 对比 · 再次使用</text><text x="904" y="414" font-size="15" fill="#a8a29e">保存在当前画布</text></g></svg>
